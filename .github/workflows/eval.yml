name: eval

on:
  schedule:
    - cron: "17 3 * * *" # nightly
  push:
    paths:
      - "internal/**"
      - "cmd/**"
      - "testdata/holdout/**"
      - "testdata/eval-baseline.json"
      - "scripts/evalci.sh"
  workflow_dispatch:

jobs:
  holdout-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/evalci.sh
